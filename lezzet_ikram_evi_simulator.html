<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Lezzet İkram Evi Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#efe2c9;color:#3b2417;touch-action:manipulation}#app{min-height:100vh;background:radial-gradient(circle at 50% 0,#fff7e8 0,#f2dfbd 55%,#d2ad78 100%)}header{height:72px;background:#4f2419;color:#ffe9b4;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:0 3px 12px #0005;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:20px}.stats{display:flex;gap:10px;font-weight:800}.stat{background:#2b120d;padding:7px 10px;border-radius:10px}.shop{max-width:980px;margin:auto;padding:10px 10px 72px}.scene{position:relative;height:390px;border:6px solid #63351f;border-radius:18px;overflow:hidden;background:linear-gradient(#a9dcff 0 48%,#d9a66c 49%);box-shadow:0 10px 30px #0003}.awning{height:62px;background:repeating-linear-gradient(90deg,#fff 0 34px,#b9342c 34px 68px);border-bottom:5px solid #69331f}.sign{position:absolute;top:74px;left:50%;transform:translateX(-50%);background:#fff2c9;border:5px solid #65351f;padding:9px 18px;border-radius:10px;font-weight:1000;font-size:22px;box-shadow:0 5px 0 #5a321f}.counter{position:absolute;left:7%;right:7%;bottom:34px;height:85px;background:linear-gradient(#9b6437,#70421f);border:5px solid #4f2a17;border-radius:12px;box-shadow:0 8px 0 #4d2a18}.machine{position:absolute;bottom:88px;width:70px;height:72px;background:#eee;border:5px solid #777;border-radius:10px;box-shadow:0 5px 0 #555}.machine:after{content:"";position:absolute;width:28px;height:18px;background:#c94a36;top:13px;left:16px;border-radius:4px}.m1{left:12%}.m2{right:12%;background:#d9d9d9}
.pos{position:absolute;right:16%;bottom:112px;width:112px;height:126px;background:#1f2729;border:4px solid #111;border-radius:9px;z-index:4;box-shadow:0 4px 0 #111;transform:rotate(-3deg)}
.screen{margin:7px;background:#a9d4b0;color:#17351e;border-radius:4px;text-align:center;font-size:11px;padding:7px}.screen b{font-size:20px}.posbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px}.posbtns button{font-size:11px;border:1px solid #777;background:#333;color:#fff;border-radius:3px;padding:3px}.table{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:170px;height:52px;background:#8c5730;border:4px solid #533019;border-radius:50%;z-index:3}.chair{position:absolute;bottom:18px;width:34px;height:40px;background:#6e4327;border:4px solid #472714;border-radius:8px}.c1{left:31%}.c2{right:31%}.tray{position:absolute;left:50%;bottom:150px;transform:translate(-50%,20px) scale(.4);opacity:0;z-index:14;font-size:48px;pointer-events:none}.tray.show{animation:serveTray .7s ease}@keyframes serveTray{0%{opacity:0;transform:translate(-50%,25px) scale(.4)}35%{opacity:1;transform:translate(-50%,-15px) scale(1)}100%{opacity:0;transform:translate(-50%,-65px) scale(.7)}}.customer{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);width:92px;height:165px;z-index:8;filter:drop-shadow(0 6px 3px #0005);transition:.35s}
.customer .hair{position:absolute;left:20px;top:4px;width:52px;height:52px;background:#3b2418;border-radius:50% 50% 42% 42%;z-index:3}
.customer .face{position:absolute;left:26px;top:18px;width:40px;height:42px;background:#e8ae7e;border:3px solid #6d3d28;border-radius:48%;z-index:4}
.customer .eye{position:absolute;top:14px;width:5px;height:6px;background:#332019;border-radius:50%}.customer .eye.l{left:9px}.customer .eye.r{right:9px}
.customer .mouth{position:absolute;left:14px;top:27px;width:12px;height:5px;border-bottom:3px solid #6c2b27;border-radius:50%}
.customer .shirt{position:absolute;left:16px;top:56px;width:60px;height:67px;background:#4f75b8;border:4px solid #29466f;border-radius:15px 15px 8px 8px}
.customer .arm{position:absolute;top:61px;width:18px;height:60px;background:#e8ae7e;border:3px solid #6d3d28;border-radius:12px;z-index:1}.customer .arm.l{left:4px;transform:rotate(9deg)}.customer .arm.r{right:4px;transform:rotate(-9deg)}
.customer .leg{position:absolute;top:117px;width:23px;height:48px;background:#3d435b;border:3px solid #252b3d;border-radius:7px}.customer .leg.l{left:23px}.customer .leg.r{right:23px}.customer.female .hair{left:17px;top:0;width:58px;height:58px;border-radius:48% 48% 45% 45%;background:#4a2a1d}
.customer.female .face{left:27px;top:18px}
.customer.female .shirt{left:12px;width:68px;border-radius:18px 18px 10px 10px;background:#b85c7a;border-color:#78374e}
.customer.female .arm.l{left:2px}.customer.female .arm.r{right:2px}
.customer.female .leg.l{left:25px}.customer.female .leg.r{right:25px}

.bubble{position:absolute;bottom:270px;z-index:12;left:50%;transform:translateX(-50%);background:white;border:3px solid #57301d;border-radius:14px;padding:9px 13px;font-weight:900;display:none;white-space:normal;max-width:90%;text-align:center}.cards{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding:3px 2px 8px;scroll-snap-type:x mandatory}.card{min-width:145px;scroll-snap-align:start}.card{background:#fff9ed;position:relative;z-index:2;transition:.2s;border:3px solid #b77a45;border-radius:14px;padding:12px;box-shadow:0 5px 12px #0002}.food{font-size:40px}.name{font-weight:900;font-size:18px}.price{color:#6c4325;font-weight:800;margin:3px 0 8px}.btn{border:0;cursor:pointer;touch-action:manipulation;border-radius:9px;padding:10px 12px;background:#8d2f25;color:white;font-weight:900;width:100%;box-shadow:0 3px 0 #5a1e18}.btn:active{transform:translateY(2px);box-shadow:none}.disabled{opacity:.45}.log{margin-top:15px;background:#fff8e9;border:3px solid #b77a45;border-radius:14px;padding:12px;min-height:58px}.upgrade{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.upgrade .btn{width:auto;background:#365d39}.overlay{position:fixed;inset:0;background:#25120dd9;display:flex;align-items:center;justify-content:center;z-index:100;pointer-events:auto}.overlay.hidden{display:none!important}.modal{width:min(400px,90vw);max-height:90vh;overflow:auto;background:#fff6e3;border:5px solid #9b6035;border-radius:18px;padding:22px;text-align:center;box-shadow:0 15px 40px #0008}.title{font-size:34px;font-weight:1000;color:#7b2b22;text-shadow:2px 2px #e5c78d}.start{font-size:20px;padding:14px;margin-top:14px}.hidden{display:none!important}@media(max-width:600px){
.scene{height:355px}.sign{font-size:17px;top:68px}.stats{gap:4px;font-size:12px}.stat{padding:6px}
.customer{bottom:82px;left:48%;transform:translateX(-50%) scale(.9)}
.bubble{bottom:252px;font-size:12px}.pos{right:5%;bottom:105px;transform:scale(.9);transform-origin:bottom right}
.machine{bottom:105px}.counter{bottom:28px}.table{bottom:20px}
.cards{display:flex}.card{min-width:150px}.upgrade{position:fixed;bottom:5px;left:8px;right:8px;z-index:15;margin:0;background:#0004;padding:4px;border-radius:8px}.upgrade .btn{flex:1}
}
#timeSky{position:fixed;left:0;right:0;top:58px;bottom:70px;z-index:0;pointer-events:none;transition:background 1s ease}
#game{position:relative;z-index:1}
</style></head><body><div id="timeSky"></div><div id="app">
<header><div class="brand">🍰 LEZZET İKRAM EVİ</div><div class="stats"><div class="stat">💰 <span id="money">100</span>₺</div><div class="stat">⭐ <span id="rep">0</span></div></div></header>
<main class="shop"><div class="scene"><div class="awning"></div><div class="sign">LEZZET İKRAM EVİ</div><div class="bubble" id="bubble"></div><div id="tray" class="tray">🍽️</div><div class="customer" id="customer">
<div class="hair"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div>
<div class="shirt"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div>
</div><div class="machine m1"></div><div class="machine m2"></div>
<div class="pos"><div class="screen" id="posScreen">POS<br><b>₺</b></div>
<div class="posbtns"><button onclick="showPOS()">1</button><button onclick="showPOS()">2</button><button onclick="showPOS()">3</button><button onclick="showPOS()">4</button><button onclick="showPOS()">5</button><button onclick="showPOS()">6</button><button onclick="showPOS()">7</button><button onclick="showPOS()">8</button><button onclick="showPOS()">9</button></div></div>
<div class="counter"></div><div class="table"></div><div class="chair c1"></div><div class="chair c2"></div></div>
<div class="cards" id="menu"></div><div class="log" id="log">👋 Müşteri bekleniyor...</div><div class="upgrade"><button class="btn" id="upgrade">🏪 Dükkânı geliştir · 150₺</button><button class="btn" id="newday">🌅 Yeni gün</button></div></main>
<div class="overlay hidden" id="pay"><div class="modal">
<div class="title">💳 KASA & ÖDEME</div>
<p id="payText"></p>
<div id="payBtns"></div>
<button type="button" class="btn start" onclick="closePay()">İptal</button>
</div></div>
<div class="overlay" id="start">
      <div class="modal">
        <div class="title">LEZZET İKRAM EVİ</div>
        <p>🍰 Dükkânını işlet, müşterilere servis yap, ödemeleri al ve para kazan!</p>
        <button type="button" class="btn start" id="play" onclick="startGame()" type="button" onclick="startGame()">▶ OYUNA BAŞLA</button>
      </div>
    </div></div>
<script>
const products=[["Kıymalı Patatesli Börek","🥟",470],["Sade Patatesli Börek","🥟",400],["Otlu Peynirli Börek","🥧",470],["Patlıcanlı Arnavut Böreği","🥧",400],["Pırpeç","🍳",400],["Kurabiye","🍪",450],["Mayalı Poğaça","🥐",20],["Dereotlu Poğaça","🥐",25],["Dilim Kek","🍰",50],["Islak Kek","🍫",90],["Cupcake","🧁",50],["İçli Köfte","🧆",80],["Kısır","🥗",90],["Patates Salatası","🥔",90],["Mercimek Köftesi","🟢",90],["Börülce Salatası","🥗",120],
["Çay","🍵",15],["Türk Kahvesi","☕",35],["Limonata","🍋",30],["Ayran","🥛",25],["Su","💧",10]];
let money=100,rep=0,customer=null,pending=null,served=0,upgradeLevel=1,day=1,customersToday=0,dayChanging=false;
const  $ = x = > document.getElementById ( x ) ;​
fonksiyon  render ( ) {
 $ ( "para" ) . metinİçeriği = para ; $ ( "temsilci" ) . metinİçerik = temsilci ;
 $ ( "menü" ) . innerHTML = ürünler . map ( ( p , i ) => {
   const  wanted = customer && customer.items.includes ( i ) ;​​​​
   const  done = customer && customer . serve . includes ( i ) ;
   return  `<div class="card" style=" ${ done ? 'opacity:.65;border-color:#4b8a4b;' : wanted ? 'outline:4px solid #3b7d3b;' : '' } ">
     <div class="food"> ${ p [ 1 ] } </div>
     <div class="name"> ${ p [ 0 ] } </div>
     <div class="price"> ${ p [ 2 ] } ₺</div>
     ${ done ? '<div style="font-weight:900;color:#36713a;margin-bottom:5px">✅ Servislendi</div>' : wanted ? '<div style="font-weight:900;color:#36713a;margin-bottom:5px">👤 Siparişte!</div>' : '' }
     <button class="btn ${ ! customer || done ? 'disabled' : '' } " onclick="serve( ${ i } )"> ${ done ? '✅ Verildi' : '🍽️ Servis ver' } </button>
   </div>` ;
 } ) . katılmak ( "" ) ;
}
 spawnNextCustomer(){
  if(customer) return;
  newCustomer();

 newCustomer(){
 if(!gameStarted || customer || dayChanging)return;
 if(customersToday>=10){endDay();return;}

 const femaleNames=["Ayşe","Zeynep","Elif","Seda","Derya","Buse","Ceren","Ece"];
 const maleNames=["Mehmet","Emre","Mert","Burak","Can","Kerem","Ahmet","Arda"];
 const female=Math.random()<0.5;
 const names=female?femaleNames:maleNames;
 const name=names[Math.floor(Math.random()*names.length)];
 const count=Math.random()<0.55?1:(Math.random()<0.75?2:3);
 const items=[];
 while(items.length<count){
   const i=Math.floor(Math.random()*products.length);
   if(!items.includes(i))items.push(i);
 }
 const total=items.reduce((sum,i)=>sum+products[i][2],0);
 const payment=Math.random()<0.52?"cash":"card";
 let cashGiven=total;
 if(payment==="cash"){
   const valid=[total,Math.ceil(total/50)*50,Math.ceil(total/100)*100,Math.ceil(total/200)*200]
     .filter((v,i,a)=>v>=total&&a.indexOf(v)===i);
   cashGiven=valid[Math.floor(Math.random()*valid.length)];
 }

 customersToday++;
 customer={name,gender:female?"female":"male",items,served:[],total,payment,cashGiven};

 $("customer").classList.remove("hidden","female","male");
 $("customer").classList.add(female?"female":"male");
 $("bubble").style.display="block";
 $("bubble").innerHTML=`💬 <b>${name}</b><br>${items.map(i=>products[i][0]).join(" + ")}`;
 $("log").textContent=`👤 ${name} geldi. Siparişini hazırla!`;
 render();
}function serve(i){
 if(!customer){$("log").textContent="⏳ Müşteri bekleniyor.";return;}
 if(!customer.items.includes(i)){ $("log").textContent="❌ Bu ürün siparişte yok.";return; }
 if(customer.served.includes(i))return;
 customer.served.push(i);
 const left=customer.items.filter(x=>!customer.served.includes(x));
 $("log").textContent=`🍽️ ${products[i][0]} servis edildi!`;
 if(!left.length)setTimeout(()=>openPayment(customer),300);
 render();
}

function openPayment(order){
 pending=order;
 if(order.payment==="cash"){
   $("payText").innerHTML=`💵 <b>${order.name}</b><br>Hesap: <b>${order.total}₺</b>`;
   $("payBtns").innerHTML=`<div class="paybox">Verilen: <b>${order.cashGiven}₺</b><br>Para üstü: <b>${order.cashGiven-order.total}₺</b></div>
   <button type="button" class="btn start" onclick="acceptCash()">💵 Parayı al</button>`;
 }else{
   $("payText").innerHTML=`💳 <b>${order.name}</b><br>Ödenecek: <b>${order.total}₺</b>`;
   $("payBtns").innerHTML=`<div class="paybox">📟 POS hazır</div>
   <button type="button" class="btn start" onclick="acceptCard()">💳 Kartı okut</button>`;
 }
 $("pay").classList.remove("hidden");$("pay").style.display="flex";
}

function acceptCash(){
 if(!pending)return;
 const o=pending; money+=o.total;rep++;
 $("payText").innerHTML=`✅ Nakit ödeme tamamlandı!<br>Para üstü: <b>${o.cashGiven-o.total}₺</b>`;
 $("payBtns").innerHTML=`<button type="button" class="btn start" onclick="sendCustomer()">➡️ Müşteriyi gönder</button>`;
 render();
}
function acceptCard(){
 if(!pending)return;
 const o=pending; money+=o.total;rep++;
 $("payText").innerHTML=`✅ Kart ödemesi tamamlandı!`;
 $("payBtns").innerHTML=`<button type="button" class="btn start" onclick="sendCustomer()">➡️ Müşteriyi gönder</button>`;
 render();
}
function sendCustomer(){
 if(!pending)return;
 const name=pending.name;
 customer=null;pending=null;
 $("bubble").style.display="none";$("customer").classList.add("hidden");
 $("pay").classList.add("hidden");$("pay").style.display="none";
 $("log").textContent=`🚪 ${name} dükkândan çıktı.`;
 render();
 setTimeout(()=>customersToday>=10?endDay():newCustomer(),700);
}
function endDay(){
 if(dayChanging)return;
 dayChanging=true;
 const modal=document.getElementById("dayEndModal");
 if(modal){modal.classList.remove("hidden");modal.style.display="flex";}
 else{
   const m=document.createElement("div");m.id="dayEndModal";m.className="overlay";
   m.innerHTML=`<div class="modal"><div class="title">🌙 ${day}. GÜN BİTTİ</div><p>10 müşteri tamamlandı.</p><p>💰 Kasa: <b>${money}₺</b></p><button type="button" class="btn start" onclick="startNextDay()">☀️ ${day+1}. GÜNE GEÇ</button></div>`;
   document.body.appendChild(m);
 }
 $("log").textContent=`🌙 ${day}. gün bitti!`;
}
function startNextDay(){
 const m=document.getElementById("dayEndModal");if(m){m.remove();}
 day++;customersToday=0;dayChanging=false;
 $("log").textContent=`☀️ ${day}. gün başladı!`;render();setTimeout(newCustomer,400);
}

function closePay(){
 $("pay").classList.add("hidden");
 $("pay").style.display="none";
}
function finishSale(method){
 if(!pending)return;
 if(method==="cash") acceptRandomCash();
 else acceptRandomCard();
}
function cashPay(){acceptRandomCash()}
function cardPay(){acceptRandomCard()}
let gameStarted=false;
function startGame(){
 if(gameStarted)return;
 gameStarted=true;
 const st=document.getElementById("start");
 if(st){st.classList.add("hidden");st.style.display="none";}
 render();setTimeout(newCustomer,500);
}

$("upgrade").onclick=()=>{if(money>=150){money-=150;upgradeLevel++;$("log").textContent="🏪 Dükkân geliştirildi! Seviye "+upgradeLevel+" · Müşteriler artık daha hızlı geliyor.";render()}else $("log").textContent="💸 Geliştirme için 150₺ gerekiyor."};
$("newday").onclick=()=>{money+=rep*5;$("log").textContent="🌅 Yeni gün başladı! Memnuniyet bonusu: +"+rep*5+"₺";customer=null;$("bubble").style.display="none";render();setTimeout(newCustomer,700)};
</script></body></html>
